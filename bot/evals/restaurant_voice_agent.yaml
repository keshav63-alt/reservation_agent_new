name: restaurant_voice_agent

scenarios:

  # -------------------------------------------------
  # TEST 1: Name correction must not trigger a tool
  # -------------------------------------------------
  - name: name_correction_no_tool_call
    turns:
      - user: "My name is Keshav."
        expect:
          - event: response
          - event: function_call
            absent: true
            within_ms: 3000

      - user: "Actually, my name is Keshav Kumar Ray."
        expect:
          - event: response
          - event: function_call
            absent: true
            within_ms: 3000

  # -------------------------------------------------
  # TEST 2: General questions must not trigger tools
  # -------------------------------------------------
  - name: general_question_no_reservation_tool
    turns:
      - user: "What are your opening hours?"
        expect:
          - event: response
          - event: function_call
            absent: true
            within_ms: 3000

  # -------------------------------------------------
  # TEST 3: Availability request calls the right tool
  # -------------------------------------------------
  - name: availability_check
    turns:
      - user: "Can you check a table for two tomorrow at 7 PM?"
        expect:
          - event: function_call
            within_ms: 15000
            calls:
              - name: check_availability

          - event: response

  # -------------------------------------------------
  # TEST 4: Booking requires an explicit confirmation
  # -------------------------------------------------
  - name: booking_confirmation_flow
    turns:
      - user: "I want a table for two tomorrow at 7 PM. My name is Eval Test and my phone number is +919999000001."
        expect:
          - event: function_call
            within_ms: 15000
            calls:
              - name: check_availability

          - event: response

      - user: "Yes, please confirm the reservation."
        expect:
          - event: function_call
            within_ms: 15000
            calls:
              - name: book_reservation

          - event: response
  
