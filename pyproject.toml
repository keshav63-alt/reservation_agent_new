[project]
name = "reservations-agent"
version = "0.1.0"
description = "Restaurant reservation voice agent"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "ffmpeg>=1.4",
    "pipecat-ai-prebuilt>=1.3.0",
    "pipecat-ai[groq,nvidia,sarvam,webrtc]>=1.12.0",
    "python-dotenv>=1.2.4",
    "supabase>=2.32.0",
]

   [dependency-groups]
   dev = [
       "pytest>=9.1.1",
   ]

   [tool.pytest.ini_options]
   pythonpath = ["."]
   testpaths = ["tests"]
   filterwarnings = [
       "ignore:The 'timeout' parameter is deprecated:DeprecationWarning",
       "ignore:The 'verify' parameter is deprecated:DeprecationWarning",
   ]
